on:
  - push
  - pull_request
name: Test
jobs:
  pinact:
    runs-on: nixos
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - run: pinact run --check
  nix-flake-check:
    runs-on: nixos
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - run: nix flake check
  update:
    runs-on: nixos
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - run: ./update
